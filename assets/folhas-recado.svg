<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" fill="none">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8b27a"/>
      <stop offset="1" stop-color="#9e8757"/>
    </linearGradient>
    <style>
      .stem{stroke:url(#gold);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.78}
      .leaf{fill:#849078;stroke:#a9905d;stroke-width:.7;opacity:.78}
      .flower{fill:#d5aaa8;stroke:#b99582;stroke-width:.65;opacity:.78}
      .bud{fill:#cdbd91;opacity:.8}
    </style>
  </defs>

  <!-- canto superior esquerdo -->
  <g>
    <path class="stem" d="M18 88C34 62 55 43 86 27M27 70C39 69 49 64 58 54M45 49C48 36 57 27 68 21"/>
    <ellipse class="leaf" cx="34" cy="63" rx="5" ry="10" transform="rotate(-58 34 63)"/>
    <ellipse class="leaf" cx="48" cy="52" rx="5" ry="10" transform="rotate(-42 48 52)"/>
    <ellipse class="leaf" cx="61" cy="39" rx="4.5" ry="9" transform="rotate(-30 61 39)"/>
    <ellipse class="leaf" cx="72" cy="29" rx="4" ry="8" transform="rotate(-20 72 29)"/>
    <circle class="bud" cx="84" cy="27" r="2.3"/>
    <g transform="translate(26 79)">
      <circle class="flower" cx="0" cy="-4" r="4"/>
      <circle class="flower" cx="4" cy="0" r="4"/>
      <circle class="flower" cx="0" cy="4" r="4"/>
      <circle class="flower" cx="-4" cy="0" r="4"/>
      <circle cx="0" cy="0" r="2" fill="#c2a360"/>
    </g>
  </g>

